name: Lint Community Docs & Templates

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: Validate Markdown Encoding & YAML Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Safely
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --no-cache-dir "PyYAML>=6.0.2"

      - name: Run Clean-Room Docs & YAML Hygiene Checks
        run: python .github/scripts/lint_docs.py
